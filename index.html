<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>3D - Planilla de Puntajes</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
body{padding-bottom:220px}
.app{max-width:760px;margin:auto}
.top{height:62px;display:grid;grid-template-columns:42px 1fr 46px 46px;align-items:center;padding:0 8px;border-bottom:1px solid #ddd;position:sticky;top:0;background:#fff;z-index:20}
.top button{border:0;background:transparent;font-size:28px;height:48px}
.top h1{font-size:19px;text-align:center;margin:0;font-weight:700}
.small{display:block;font-size:9px;margin-top:-2px}
.brandline{height:5px;display:grid;grid-template-columns:1fr 1fr 1fr}
.brandline i:nth-child(1){background:#49a66a}.brandline i:nth-child(2){background:#f1d431}.brandline i:nth-child(3){background:#df3d35}
.archers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 10px;background:#f7f7f7;border-bottom:1px solid #ddd;position:sticky;top:67px;z-index:19}
.archer{border:1px solid #bbb;background:#fff;border-radius:10px;padding:7px 3px;text-align:center;font-size:12px;font-weight:700;min-height:48px}
.archer.active{border:3px solid #49a66a;padding:5px 1px}
.archer small{display:block;font-size:9px;color:#666;font-weight:500;margin-top:3px}
.group-progress{text-align:center;padding:7px 10px;background:#fff;font-size:12px;font-weight:700;border-bottom:1px solid #ddd}
.profile{display:none;padding:10px;background:#fafafa;border-bottom:1px solid #ddd}
.profile.show{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.profile label{font-size:10px;font-weight:700;display:block;margin:0 0 3px 2px}
.profile input,.profile select{width:100%;height:39px;border:1px solid #bbb;border-radius:9px;padding:0 9px;background:#fff;font-size:14px}
.profile button{grid-column:1/-1;height:38px;border:1px solid #888;border-radius:9px;background:#fff;font-weight:700}
.summary{display:grid;grid-template-columns:1fr 1fr 1fr 1.65fr;gap:7px;padding:9px 10px;border-bottom:1px solid #ddd;position:sticky;top:115px;background:#fff;z-index:18}
.card{border:1px solid #d0d0d0;border-radius:12px;text-align:center;padding:7px 3px;background:#fff}
.card .label{font-size:11px}.card .value{font-size:25px;font-weight:800;margin-top:4px}
.counters{display:grid;grid-template-columns:repeat(5,1fr);margin-top:3px}
.counters div{font-size:11px}.counters b{display:block;font-size:18px;margin-top:2px}
.table{padding:5px 10px 15px}
.head,.row{display:grid;grid-template-columns:34px 1fr 1fr 66px 66px;gap:6px;align-items:center}
.head{height:39px;font-size:12px;font-weight:700;text-align:center}
.head div{border-bottom:2px solid #111;padding-bottom:5px}.head div:first-child{text-align:left}
.row{min-height:55px;margin-bottom:3px}
.num{text-align:center;font-size:14px;font-weight:700}
.cell{height:45px;border:1px solid #d5d5d5;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;background:#fff}
.cell.active{outline:3px solid #777}
.result,.running{text-align:center;font-size:17px;font-weight:700}
.running{font-size:18px}
.placeholder{color:#bbb}
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(250,250,250,.98);border-top:1px solid #ccc;box-shadow:0 -4px 18px rgba(0,0,0,.08);z-index:30;padding:8px 10px 9px}
.pad{max-width:740px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.score{height:66px;border:1px solid #bbb;border-radius:13px;background:#fff;font-size:29px;font-weight:800;box-shadow:0 1px 3px #ccc}
.score:nth-child(1){border-bottom:5px solid #f1d431}.score:nth-child(2){border-bottom:5px solid #df3d35}.score:nth-child(3){border-bottom:5px solid #49a66a}.score:nth-child(4){border-bottom:5px solid #49a66a}
.score-m{width:100%;height:48px;margin-top:7px;font-size:24px;border-bottom:5px solid #222}
.score-zero{display:block;font-size:9px;margin-top:-2px;font-weight:500}
.fullsheet{width:100%;height:45px;margin-top:8px;border:1px solid #bbb;border-radius:11px;background:#fff;font-size:13px;font-weight:800}
.tools{max-width:740px;margin:7px auto 0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.tool{height:44px;border:1px solid #bbb;border-radius:10px;background:#fff;font-size:11px;font-weight:700}
.footer{max-width:740px;margin:7px auto 0;display:grid;grid-template-columns:1fr 1fr 1fr;font-size:10px}
.footer div:nth-child(2){text-align:center}.footer div:nth-child(3){text-align:right;font-weight:700}
@media(max-width:430px){
 .top h1{font-size:17px}.summary{top:122px}.archers{top:67px}
 .head,.row{grid-template-columns:27px 1fr 1fr 55px 55px;gap:5px}
 .cell{height:43px;font-size:18px}.result,.running{font-size:15px}
 .card .value{font-size:23px}.score{height:64px;font-size:27px}.score-m{height:46px;font-size:24px}
}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;padding:10px;overflow:auto}
.modal.show{display:block}
.sheet{max-width:900px;margin:0 auto;background:#fff;border-radius:14px;padding:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.sheet-head h2{margin:0;font-size:19px}
.sheet-close{border:1px solid #bbb;background:#fff;border-radius:9px;padding:8px 11px;font-weight:700}
.sheet-card{border:1px solid #ccc;border-radius:12px;margin:10px 0;padding:10px}
.sheet-card h3{margin:0 0 4px;font-size:16px}
.sheet-card p{margin:4px 0 9px;font-size:12px}
.sheet-table{width:100%;border-collapse:collapse;font-size:12px}
.sheet-table th,.sheet-table td{border:1px solid #ccc;padding:6px;text-align:center}
.sheet-table th{background:#f4f4f4}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button onclick="newRound()">‹</button>
    <h1>3D - Planilla de Puntajes</h1>
    <button onclick="undo()">↶<span class="small">Deshacer</span></button>
    <button onclick="toggleProfile()">☰<span class="small">Menú</span></button>
  </div>
  <div class="brandline"><i></i><i></i><i></i></div>

  <div class="archers" id="archers"></div>

  <div class="group-progress" id="groupProgress">Animal 1 de 24 · Turno de Arquero 1</div>
  <div class="profile" id="profile">
    <div><label>Nombre</label><input id="firstName" placeholder="Nombre"></div>
    <div><label>Apellido</label><input id="lastName" placeholder="Apellido"></div>
    <div><label>Tipo de arco</label>
      <select id="bow"><option value="">Seleccionar</option><option>Recurvo</option><option>Compuesto</option><option>Longbow</option><option>Tradicional</option><option>Instintivo</option></select>
    </div>
    <div><label>Categoría</label>
      <select id="cat"><option value="">Seleccionar</option><option>A</option><option>B</option><option>C</option><option>D</option></select>
    </div>
    <button onclick="saveProfile()">✓ Guardar datos del arquero</button>
  </div>

  <div class="summary">
    <div class="card"><div class="label">TOTAL</div><div class="value" id="total">0</div></div>
    <div class="card"><div class="label">ANIMALES</div><div class="value"><span id="done">0</span> / 24</div></div>
    <div class="card"><div class="label">PROMEDIO</div><div class="value" id="avg">0,0</div></div>
    <div class="card"><div class="label">CONTADORES</div>
      <div class="counters"><div>11<b id="c11">0</b></div><div>10<b id="c10">0</b></div><div>8<b id="c8">0</b></div><div>5<b id="c5">0</b></div><div>M<b id="cM">0</b></div></div>
    </div>
  </div>

  <div class="table">
    <div class="head"><div>Nº</div><div>FLECHA 1</div><div>FLECHA 2</div><div>SUBTOTAL</div><div>TOTAL</div></div>
    <div id="rows"></div>
  </div>
</div>

<div class="bottom">
  <div class="pad">
    <button class="score" onclick="addScore(11)">11</button>
    <button class="score" onclick="addScore(10)">10</button>
    <button class="score" onclick="addScore(8)">8</button>
    <button class="score" onclick="addScore(5)">5</button>
  </div>
  <button class="score score-m" onclick="addScore(0)">M<span class="score-zero">0</span></button>
  <div class="tools">
    <button class="tool" onclick="undo()">↶<br>BORRAR ÚLTIMA FLECHA</button>
    <button class="tool" onclick="deleteAnimal()">☒<br>BORRAR ÚLTIMO ANIMAL</button>
    <button class="tool" onclick="finish()">🏁<br>FINALIZAR TIRADA</button>
  </div>
  <button class="fullsheet" onclick="showFullSheet()">📊 PLANILLA COMPLETA</button>
  <div class="footer">
    <div>Inicio: <span id="start"></span></div>
    <div>3D - 24 Animales</div>
    <div onclick="saveAll()">▣ GUARDAR<br><span style="font-weight:500">Automático</span></div>
  </div>
</div>

<div class="modal" id="fullSheetModal">
  <div class="sheet">
    <div class="sheet-head"><h2>📊 Planilla completa · 3D</h2><button class="sheet-close" onclick="closeFullSheet()">Cerrar ✕</button></div>
    <div id="fullSheetContent"></div>
  </div>
</div>

<script>
const KEY='planilla3d_4archers_v7';
let data={names:['Arquero 1','Arquero 2','Arquero 3','Arquero 4'],
 profiles:[{}, {}, {}, {}],
 scores:[[],[],[],[]],
 active:0,
 start:new Date().toLocaleString('es-UY')};

let profileOpen=false;

function showFullSheet(){
  let html='';
  for(let i=0;i<4;i++){
    const p=data.profiles[i]||{};
    const name=((p.first||'')+' '+(p.last||'')).trim()||data.names[i]||('Arquero '+(i+1));
    const info=(p.bow||'Arco')+' · '+(p.cat||'Cat.');
    const sc=data.scores[i]||[];
    let total=0,c11=0,c10=0,c8=0,c5=0,cM=0;
    sc.forEach(pair=>pair.forEach(v=>{if(v!==null){total+=v;if(v===11)c11++;if(v===10)c10++;if(v===8)c8++;if(v===5)c5++;if(v===0)cM++;}}));
    html+=`<div class="sheet-card"><h3>Arquero ${i+1}: ${escapeHtml(name)}</h3><p>${escapeHtml(info)} · <b>Total: ${total}</b> · 11:${c11} · 10:${c10} · 8:${c8} · 5:${c5} · M:${cM}</p>
    <div style="overflow:auto"><table class="sheet-table"><tr><th>Animal</th><th>Flecha 1</th><th>Flecha 2</th><th>Subtotal</th><th>Acumulado</th></tr>`;
    let run=0;
    for(let j=0;j<24;j++){
      const pair=sc[j]||[null,null], a=pair[0], b=pair[1], complete=a!==null&&b!==null;
      if(a!==null)run+=a;if(b!==null)run+=b;
      html+=`<tr><td>${j+1}</td><td>${a===null?'':(a===0?'M':a)}</td><td>${b===null?'':(b===0?'M':b)}</td><td>${complete?a+b:'-'}</td><td>${complete?run:'-'}</td></tr>`;
    }
    html+='</table></div></div>';
  }
  document.getElementById('fullSheetContent').innerHTML=html;
  document.getElementById('fullSheetModal').classList.add('show');
}
function closeFullSheet(){document.getElementById('fullSheetModal').classList.remove('show')}

function load(){
  try{
    const saved=JSON.parse(localStorage.getItem(KEY));
    if(saved && Array.isArray(saved.scores) && saved.scores.length===4) data=saved;
  }catch(e){}
  if(!data.start)data.start=new Date().toLocaleString('es-UY');
  document.getElementById('start').textContent=data.start;
  render();
}
function saveAll(){localStorage.setItem(KEY,JSON.stringify(data))}
function current(){return data.scores[data.active]}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderArchers(){
  const box=document.getElementById('archers');
  box.innerHTML='';
  for(let i=0;i<4;i++){
    const p=data.profiles[i]||{};
    const name=((p.first||'')+' '+(p.last||'')).trim()||data.names[i];
    const info=(p.bow||'Arco')+' · '+(p.cat||'Cat.');
    const el=document.createElement('button');
    el.className='archer '+(i===data.active?'active':'');
    el.type='button';
    el.innerHTML='<div>'+escapeHtml(name)+'</div><small>'+escapeHtml(info)+'</small>';
    el.onclick=()=>selectArcher(i);
    box.appendChild(el);
  }
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function selectArcher(i){
  data.active=i;
  saveAll();
  fillProfile();
  render();
}
function fillProfile(){
  const p=data.profiles[data.active]||{};
  document.getElementById('firstName').value=p.first||'';
  document.getElementById('lastName').value=p.last||'';
  document.getElementById('bow').value=p.bow||'';
  document.getElementById('cat').value=p.cat||'';
}
function toggleProfile(){
  profileOpen=!profileOpen;
  document.getElementById('profile').classList.toggle('show',profileOpen);
  fillProfile();
}
function saveProfile(){
  data.profiles[data.active]={
    first:document.getElementById('firstName').value.trim(),
    last:document.getElementById('lastName').value.trim(),
    bow:document.getElementById('bow').value,
    cat:document.getElementById('cat').value
  };
  const p=data.profiles[data.active];
  data.names[data.active]=((p.first+' '+p.last).trim())||('Arquero '+(data.active+1));
  saveAll();renderArchers();
}
function currentAnimalIndex(){
  const s=current();
  if(!s.length) return 0;
  const last=s[s.length-1];
  return (last[1]===null ? s.length-1 : s.length);
}
function addScore(v){
  const s=current();
  if(s.length>24)return;
  let idx=currentAnimalIndex();
  if(idx>=24)return alert('Ya completaste los 24 animales.');
  if(!s[idx]) s[idx]=[v,null];
  else if(s[idx][1]===null) s[idx][1]=v;
  else return;

  const complete = s[idx][0]!==null && s[idx][1]!==null;
  saveAll();
  render();

  // Después de la segunda flecha, pasa automáticamente al siguiente arquero.
  if(complete){
    setTimeout(()=>{
      const next=(data.active+1)%4;
      data.active=next;
      saveAll();
      fillProfile();
      render();
      window.scrollTo({top:0,behavior:'smooth'});
    },120);
  }
}
function undo(){
  const s=current();
  if(!s.length)return;
  const last=s[s.length-1];
  if(last[1]!==null){
    last[1]=null;
  }else{
    s.pop();
  }
  saveAll();render();
}
function deleteAnimal(){
  const s=current();
  if(!s.length)return;
  if(confirm('¿Borrar el último animal de '+(data.names[data.active]||'este arquero')+'?')){
    s.pop();saveAll();render();
  }
}
function render(){
  renderArchers();
  const s=current();
  const idx=currentAnimalIndex();
  const p=data.profiles[data.active]||{};
  const archerName=((p.first||'')+' '+(p.last||'')).trim()||data.names[data.active]||('Arquero '+(data.active+1));
  document.getElementById('groupProgress').textContent='Animal '+Math.min(idx+1,24)+' de 24 · Turno de '+archerName;
  let total=0,c11=0,c10=0,c8=0,c5=0,cM=0,done=0;
  for(const pair of s){
    for(const v of pair){
      if(v!==null){
        total+=v;
        if(v===11)c11++; if(v===10)c10++; if(v===8)c8++; if(v===5)c5++; if(v===0)cM++;
      }
    }
    if(pair[0]!==null && pair[1]!==null)done++;
  }
  document.getElementById('total').textContent=total;
  document.getElementById('done').textContent=done;
  document.getElementById('avg').textContent=done?(total/done).toFixed(1).replace('.',','):'0,0';
  document.getElementById('c11').textContent=c11;
  document.getElementById('c10').textContent=c10;
  document.getElementById('c8').textContent=c8;
  document.getElementById('c5').textContent=c5;
  document.getElementById('cM').textContent=cM;

  const rows=document.getElementById('rows');
  rows.innerHTML='';
  let running=0;
  for(let i=0;i<24;i++){
    const pair=s[i]||[null,null];
    const a=pair[0],b=pair[1],complete=a!==null&&b!==null;
    if(a!==null)running+=a;
    if(b!==null)running+=b;
    const row=document.createElement('div');
    row.className='row';
    const activeFirst=(i===s.length && a===null) || (i===s.length-1 && a!==null && b===null);
    row.innerHTML='<div class="num">'+(i+1)+'</div>'+
      '<div class="cell '+(activeFirst?'active':'')+'">'+(a===null?'<span class="placeholder"> </span>':a)+'</div>'+
      '<div class="cell '+(i===s.length-1&&a!==null&&b===null?'active':'')+'">'+(b===null?'<span class="placeholder"> </span>':b)+'</div>'+
      '<div class="result">'+(complete?a+b:'-')+'</div>'+
      '<div class="running">'+(complete?running:'-')+'</div>';
    rows.appendChild(row);
  }
}
function newRound(){
  if(!confirm('¿Comenzar un nuevo recorrido para los 4 arqueros?'))return;
  data.scores=[[],[],[],[]];
  data.active=0;
  data.start=new Date().toLocaleString('es-UY');
  saveAll();document.getElementById('start').textContent=data.start;render();
  window.scrollTo(0,0);
}
function finish(){
  const s=current();
  if(!s.length)return alert('Todavía no hay puntos anotados.');
  if(s.some(p=>p[0]===null||p[1]===null))return alert('Falta completar las dos flechas de un animal.');
  const total=s.reduce((t,p)=>t+p[0]+p[1],0);
  const c11=s.flat().filter(v=>v===11).length,c10=s.flat().filter(v=>v===10).length,cM=s.flat().filter(v=>v===0).length;
  alert('🏆 TIRADA FINALIZADA\\n\\n'+data.names[data.active]+'\\nAnimales: '+s.length+' / 24\\nTotal: '+total+'\\n11: '+c11+'   10: '+c10+'   M: '+cM+'\\nPromedio: '+(total/s.length).toFixed(1));
}
load();
</script>
</body>
</html>
